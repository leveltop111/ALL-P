<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practical Files Viewer</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
        }


        /* HEADER */

        header {
            background: white;
            padding: 25px 40px;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }


        /* MAIN */

        .container {
            width: 96%;
            margin: 25px auto;
        }


        /* CATEGORY */

        .category {
            background: white;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            overflow: hidden;
        }


        /* CATEGORY TITLE */

        .category-title {
            padding: 22px 25px;
            font-size: 25px;
            font-weight: bold;
            cursor: pointer;
            background: white;
        }


        .category-title:hover {
            background: #f2f2f2;
        }


        .arrow {
            display: inline-block;
            margin-right: 8px;
            transition: transform 0.2s;
        }


        .category.open .arrow {
            transform: rotate(90deg);
        }


        /* FILE CONTENT */

        .file-content {
            display: none;
            padding: 0 18px 18px 18px;
        }


        .category.open .file-content {
            display: block;
        }


        /* BLACK CODE BOX */

        pre {
            margin: 0;
            padding: 22px 18px;

            background: #171717;
            color: #ffffff;

            border-radius: 7px;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 15px;

            line-height: 1.5;

            white-space: pre-wrap;

            word-wrap: break-word;

            overflow-x: auto;
        }


        /* FOOTER */

        footer {
            text-align: center;
            color: #777;
            padding: 35px;
            font-size: 16px;
        }


        /* ERROR */

        .error {
            padding: 20px;
            background: #ffe5e5;
            color: #b00000;
            border: 1px solid #ffaaaa;
            border-radius: 8px;
            margin-bottom: 20px;
        }


        /* LOADING */

        #loading {
            text-align: center;
            padding: 30px;
            font-size: 18px;
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        📁 Practical Files Viewer

    </header>



    <!-- MAIN -->

    <div class="container">


        <div id="loading">

            Loading practical files...

        </div>


        <div id="viewer"></div>


    </div>



    <footer>

        Practical Files Viewer

    </footer>



    <script>


        /*
        ==================================================
        YOUR FILES

        These are the exact files in your repository:

        EH
        MJ
        SW
        ==================================================
        */


        const files = [

            {
                title: "EH Practicals",
                file: "EH"
            },

            {
                title: "MJ Practicals",
                file: "MJ"
            },

            {
                title: "SW Practicals",
                file: "SW"
            }

        ];



        /*
        ==================================================
        LOAD FILE
        ==================================================
        */

        async function getFile(filename) {

            const response =
                await fetch("./" + filename);


            if (!response.ok) {

                throw new Error(
                    filename +
                    " could not be loaded."
                );

            }


            return await response.text();

        }



        /*
        ==================================================
        CREATE CATEGORY
        ==================================================
        */

        function createCategory(
            title,
            text
        ) {


            const category =
                document.createElement("div");


            category.className =
                "category";


            /*
            TITLE
            */

            const heading =
                document.createElement("div");


            heading.className =
                "category-title";


            heading.innerHTML =
                '<span class="arrow">▼</span>' +
                title;


            /*
            CLICK
            */

            heading.onclick =
                function () {

                    category.classList.toggle(
                        "open"
                    );

                };


            /*
            CONTENT
            */

            const content =
                document.createElement("div");


            content.className =
                "file-content";


            /*
            BLACK BOX
            */

            const code =
                document.createElement("pre");


            /*
            IMPORTANT:

            textContent displays the COMPLETE
            file exactly as written.

            It does NOT split P1/P2/P3.
            */

            code.textContent = text;


            content.appendChild(code);


            category.appendChild(heading);

            category.appendChild(content);


            return category;

        }



        /*
        ==================================================
        LOAD EVERYTHING
        ==================================================
        */

        async function loadPage() {


            const viewer =
                document.getElementById(
                    "viewer"
                );


            const loading =
                document.getElementById(
                    "loading"
                );


            try {


                for (
                    const item of files
                ) {


                    const text =
                        await getFile(
                            item.file
                        );


                    const category =
                        createCategory(
                            item.title,
                            text
                        );


                    viewer.appendChild(
                        category
                    );

                }


                loading.style.display =
                    "none";


            }
            catch (error) {


                loading.style.display =
                    "none";


                viewer.innerHTML =

                    '<div class="error">' +

                    '<b>Error loading files</b>' +

                    '<br><br>' +

                    error.message +

                    '<br><br>' +

                    'Make sure your repository contains files named exactly EH, MJ and SW.' +

                    '</div>';

            }

        }



        /*
        ==================================================
        START
        ==================================================
        */

        loadPage();


    </script>


</body>

</html>
