<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Practical Files Viewer</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f6f8;

            color: #222;

        }


        /* HEADER */

        header {

            background: #24292f;

            color: white;

            padding: 22px 25px;

            font-size: 28px;

            font-weight: bold;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.2);

        }


        /* MAIN */

        .container {

            width: 92%;

            max-width: 1200px;

            margin: 30px auto;

        }


        /* CATEGORY */

        .category {

            background: white;

            margin-bottom: 15px;

            border-radius: 10px;

            overflow: hidden;

            border: 1px solid #ddd;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);

        }


        /* CATEGORY TITLE */

        .category-title {

            padding: 20px;

            font-size: 22px;

            font-weight: bold;

            cursor: pointer;

            user-select: none;

        }


        .category-title:hover {

            background: #f0f2f4;

        }


        .arrow {

            display: inline-block;

            width: 28px;

            transition: transform 0.2s;

        }


        .category.open .arrow {

            transform: rotate(90deg);

        }


        /* CONTENT */

        .category-content {

            display: none;

            border-top: 1px solid #ddd;

            padding: 20px;

            background: #fafafa;

        }


        .category.open .category-content {

            display: block;

        }


        /* COMPLETE FILE */

        pre {

            margin: 0;

            background: #111827;

            color: #f8fafc;

            padding: 25px;

            border-radius: 8px;

            overflow-x: auto;

            overflow-y: auto;

            white-space: pre;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 14px;

            line-height: 1.6;

            min-height: 100px;

            max-height: 700px;

        }


        /* LOADING */

        .loading {

            text-align: center;

            padding: 30px;

            font-size: 18px;

            color: #555;

        }


        /* ERROR */

        .error {

            background: #ffe5e5;

            color: #a00000;

            padding: 20px;

            border-radius: 8px;

            border: 1px solid #ffb3b3;

            margin-top: 20px;

        }


        /* FOOTER */

        footer {

            text-align: center;

            padding: 30px;

            color: #777;

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        📁 Practical Files Viewer

    </header>



    <!-- MAIN -->

    <div class="container">


        <div id="loading"
             class="loading">

            Loading practical files...

        </div>


        <div id="viewer"></div>


    </div>



    <footer>

        Practical Files Viewer

    </footer>



    <script>


        /*
        ==================================================
        YOUR FILES
        ==================================================

        EH
        MJ
        SW

        Each file contains ALL of its practicals.

        We will display the COMPLETE file exactly
        as it is written.
        ==================================================
        */


        const files = [

            {
                name: "EH",
                filename: "EH"
            },

            {
                name: "MJ",
                filename: "MJ"
            },

            {
                name: "SW",
                filename: "SW"
            }

        ];



        /*
        ==================================================
        LOAD FILE
        ==================================================
        */

        async function loadFile(filename) {


            const response =
                await fetch("./" + filename);


            if (!response.ok) {

                throw new Error(

                    "Could not load " +
                    filename +
                    " (HTTP " +
                    response.status +
                    ")"

                );

            }


            return await response.text();

        }



        /*
        ==================================================
        CREATE CATEGORY
        ==================================================
        */

        function createCategory(
            file,
            text
        ) {


            const category =
                document.createElement("div");


            category.className =
                "category";



            /*
            CATEGORY TITLE
            */

            const title =
                document.createElement("div");


            title.className =
                "category-title";


            title.innerHTML =

                '<span class="arrow">▶</span>' +

                file.name +

                " Practicals";



            /*
            CLICK CATEGORY
            */

            title.onclick = function() {

                category.classList.toggle(
                    "open"
                );

            };



            /*
            CONTENT AREA
            */

            const content =
                document.createElement("div");


            content.className =
                "category-content";



            /*
            COMPLETE FILE CONTENT

            textContent is used so the text
            appears EXACTLY as written.

            Nothing is changed.
            */

            const code =
                document.createElement("pre");


            code.textContent = text;



            content.appendChild(code);


            category.appendChild(title);

            category.appendChild(content);


            return category;

        }



        /*
        ==================================================
        LOAD ALL THREE FILES
        ==================================================
        */

        async function loadViewer() {


            const viewer =
                document.getElementById(
                    "viewer"
                );


            const loading =
                document.getElementById(
                    "loading"
                );


            try {


                /*
                Load EH, MJ and SW
                */

                for (
                    const file of files
                ) {


                    const text =
                        await loadFile(
                            file.filename
                        );


                    const category =
                        createCategory(
                            file,
                            text
                        );


                    viewer.appendChild(
                        category
                    );

                }


                /*
                Hide loading message
                */

                loading.style.display =
                    "none";


            }
            catch (error) {


                loading.style.display =
                    "none";


                viewer.innerHTML =

                    '<div class="error">' +

                    '<strong>' +

                    'Error loading practical file' +

                    '</strong>' +

                    '<br><br>' +

                    error.message +

                    '</div>';

            }

        }



        /*
        ==================================================
        START WEBSITE
        ==================================================
        */

        loadViewer();


    </script>


</body>

</html>
